<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">GestSpeak — обсудили, зафиксировали</title>
  <desc id="description">Локальный ассистент совещаний. Протокол, ответственный, срок и источник поручения в одном рабочем пространстве. Иллюстрация продукта.</desc>
  <rect width="1200" height="400" rx="12" fill="#f6f5f4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="36" width="32" height="36" rx="5" fill="none" stroke="#111" stroke-width="2"/>
    <path d="M56 51v8m5-15v22m6-18v14m6-11v8" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>
    <text x="93" y="63" fill="#111" font-size="30" font-weight="700" letter-spacing="-1">gestspeak</text>
    <circle cx="967" cy="53" r="4" fill="#3c7b54"/>
    <text x="980" y="58" fill="#615d59" font-size="14">ЛОКАЛЬНЫЙ КОНТУР</text>
    <text x="48" y="153" fill="#111" font-size="57" font-weight="700" letter-spacing="-2">Обсудили.</text>
    <rect x="36" y="172" width="489" height="72" rx="36" fill="#f6d5b8"/>
    <text x="50" y="225" fill="#111" font-size="57" font-weight="700" letter-spacing="-2">Зафиксировали.</text>
    <text x="48" y="285" fill="#615d59" font-size="20">Поручения, люди и сроки — на своих местах.</text>
    <text x="48" y="345" fill="#615d59" font-size="14">РУССКИЙ · ҚАЗАҚША · СМЕШАННАЯ РЕЧЬ</text>
    <g transform="translate(718 94)">
      <rect width="434" height="262" rx="12" fill="#fff" stroke="#dedbd7"/>
      <path d="M0 51h434" stroke="#e9e7e4"/>
      <rect x="23" y="17" width="18" height="20" rx="3" fill="none" stroke="#111" stroke-width="1.5"/>
      <path d="M27 24h10m-10 5h7" stroke="#111" stroke-width="1.5"/>
      <text x="53" y="32" font-size="14" fill="#111" font-weight="700">ОТ РЕПЛИКИ К ПОРУЧЕНИЮ</text>
      <text x="24" y="91" font-size="21" fill="#111" font-weight="700">Провести аудит датчиков</text>
      <text x="24" y="119" font-size="17" fill="#615d59">на всех 11 площадках</text>
      <text x="24" y="162" font-size="12" fill="#757575">ОТВЕТСТВЕННЫЙ</text>
      <text x="284" y="162" font-size="12" fill="#757575">СРОК</text>
      <text x="24" y="186" font-size="17" fill="#111">Нурлан Сагатович</text>
      <text x="284" y="186" font-size="17" fill="#111">15 октября</text>
      <rect x="24" y="210" width="275" height="30" rx="8" fill="#e6f3fe"/>
      <text x="38" y="230" font-size="13" fill="#0075de">Цитата + исходный срок + проверка</text>
    </g>
  </g>
</svg>
