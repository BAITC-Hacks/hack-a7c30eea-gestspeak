services:
  api:
    build:
      context: .
      args:
        WITH_AI: ${WITH_AI:-0}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - gestspeak-data:/app/data
      - ./models:/app/models:ro
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      GESTSPEAK_API_TOKEN: ${GESTSPEAK_API_TOKEN:-}
      WHISPER_MODEL_PATH: /app/models/whisper
      DIARIZATION_MODEL_PATH: /app/models/diarization
    networks: [private]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.11.10
    profiles: [ai]
    volumes:
      - ollama-models:/root/.ollama
    networks: [private]
    environment:
      OLLAMA_NO_CLOUD: '1'
    restart: unless-stopped
volumes:
  gestspeak-data:
  ollama-models:
networks:
  private:
    internal: true
